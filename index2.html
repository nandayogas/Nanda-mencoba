<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Bengkel - 3 GARAGE</title>
<style>
:root{--accent:#e10600;--bg:#050506;--text:#f5f5f7;--muted:#a1a1aa;--line:rgba(255,255,255,.1);--glass:rgba(22,22,26,.58)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;line-height:1.5}
a{color:inherit;text-decoration:none}
.wrap{width:min(1200px,calc(100% - 32px));margin:0 auto}
.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:sticky;top:0;z-index:20;background:rgba(5,5,6,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;justify-content:space-between;align-items:center;height:68px;gap:12px}
.logo{font-weight:900;font-style:italic;font-size:22px}
.logo span{color:var(--accent)}
.back{display:inline-flex;gap:8px;align-items:center;color:#d4d4d8;font-weight:600;font-size:14px}
.back:hover{color:#fff}
.hero{padding:44px 0 12px}
.hero h1{font-size:clamp(28px,5vw,44px);font-weight:900;font-style:italic}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:20px 0 60px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;margin:0}
.box{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.box iframe,.box video{position:absolute;inset:0;width:100%;height:100%;border:0}
figcaption{font-weight:800;font-size:15px}
.desc{color:var(--muted);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:60px 0;grid-column:1/-1}
footer{border-top:1px solid var(--line);padding:22px 0;color:#71717a;font-size:12px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a href="index.html" class="logo"><span>3</span> GARAGE</a>
    <a href="index.html" class="back"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Kembali ke Beranda</a>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <h1>VIDEO <span>BENGKEL</span></h1>
    <p>Dokumentasi dan informasi seputar servis mobil Subaru &amp; Mazda.</p>
  </div>
  <div class="grid" id="grid"><div class="empty">Memuat video...</div></div>
</main>

<footer>© 2026 3 GARAGE. All Rights Reserved.</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig, esc, safeHttpUrl, ytId } from "./firebase-config.js";

const db = getFirestore(initializeApp(firebaseConfig));
const grid = document.getElementById("grid");

onSnapshot(query(collection(db, "videos"), where("active", "==", true)), (snap) => {
  const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  if (!list.length) {
    grid.innerHTML = `<div class="empty">Belum ada video.</div>`;
    return;
  }
  grid.innerHTML = list.map((v) => {
    const desc = v.description ? `<div class="desc">${esc(v.description)}</div>` : "";
    if (v.type === "file") {
      const u = safeHttpUrl(v.fileUrl);
      if (!u) return "";
      return `<figure class="card">
        <div class="box"><video controls playsinline preload="metadata" src="${esc(u)}"></video></div>
        <figcaption>${esc(v.title)}</figcaption>${desc}</figure>`;
    }
    const id = ytId(v.youtubeUrl);
    if (!id) return "";
    return `<figure class="card">
      <div class="box"><iframe src="https://www.youtube.com/embed/${id}" title="${esc(v.title)}" allowfullscreen loading="lazy"></iframe></div>
      <figcaption>${esc(v.title)}</figcaption>${desc}</figure>`;
  }).join("");
}, () => {
  grid.innerHTML = `<div class="empty">Video belum bisa dimuat.</div>`;
});
</script>
</body>
</html>
