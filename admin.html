<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Admin | 3 GARAGE</title>
<link rel="icon" id="favicon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#e10600;
  --accent-2:#ff3b30;
  --bg:#0a0a0c;
  --panel:#131317;
  --panel-2:#1a1a20;
  --line:rgba(255,255,255,.1);
  --text:#fff;
  --muted:#a1a1aa;
  --ok:#22c55e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit}
a{color:inherit;text-decoration:none}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.red{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* ---------- Form dasar ---------- */
input,select,textarea{width:100%;background:#0d0d11;border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:11px 14px;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(225,6,0,.2)}
input[type=color]{padding:4px;height:46px;width:90px}
input[type=checkbox]{width:auto}
select option{background:#111}
textarea{resize:vertical}
label{display:flex;flex-direction:column;gap:7px;font-size:.88rem;font-weight:600;color:#ddd}

/* ---------- Tombol ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 20px;border-radius:12px;font-weight:700;border:1px solid transparent;cursor:pointer;transition:.2s;white-space:nowrap;text-decoration:none;color:#fff;background:none}
.btn .icon{width:18px;height:18px}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 10px 26px -12px var(--accent)}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-ghost{background:#1c1c22;border-color:var(--line)}
.btn-ghost:hover{border-color:#555}
.btn-sm{padding:8px 13px;font-size:.85rem}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{background:#1c1c22;border:1px solid var(--line);color:#fff;border-radius:10px;padding:8px 11px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.85rem;transition:.2s;min-width:38px}
.icon-btn:hover{border-color:#555}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.icon-btn.danger{color:#f87171}
.icon-btn.danger:hover{border-color:#f87171}
.link-btn{background:none;border:0;color:#fff;cursor:pointer;font-weight:600}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0%,rgba(225,6,0,.18),transparent 55%),var(--bg)}
.login-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px 28px;display:grid;gap:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
.brand-big{font-family:Orbitron,Inter,sans-serif;font-weight:800;font-size:2.2rem;font-style:italic;text-align:center}
.brand-big span{color:var(--accent)}
.login-card .btn{margin-top:6px}
.err{color:#ff7b7b;font-size:.9rem;min-height:20px}
.hint{font-size:.78rem;color:var(--muted);text-align:center}

/* ---------- Layout ---------- */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:265px;background:#0d0d10;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 16px;gap:18px;z-index:60;transform:translateX(-100%);transition:transform .3s}
.sidebar.open{transform:none}
.side-brand{font-family:Orbitron,Inter,sans-serif;font-weight:800;font-style:italic;font-size:1.5rem;padding:4px 10px}
.side-brand span{color:var(--accent)}
.side-brand small{display:block;font-family:Inter;font-style:normal;font-size:.55rem;letter-spacing:.2em;color:var(--muted);margin-top:2px}
#sideNav{display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1}
#sideNav button{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;background:none;border:0;color:#cfcfd6;cursor:pointer;text-align:left;font-weight:600;font-size:.92rem;transition:.2s}
#sideNav button:hover{background:#17171c;color:#fff}
#sideNav button.active{background:linear-gradient(90deg,rgba(225,6,0,.22),rgba(225,6,0,.04));color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
#sideNav button.active .icon{color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55;display:none}
.overlay.show{display:block}
.main{min-height:100vh;padding:0 22px 40px}
.topbar{position:sticky;top:0;z-index:40;background:rgba(10,10,12,.9);backdrop-filter:blur(10px);display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:24px}
.topbar h1{font-size:1.25rem;font-weight:800;flex:1}
.who{font-size:.82rem;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-toggle{display:inline-flex}
@media(min-width:960px){
  .sidebar{transform:none}
  .main{margin-left:265px}
  .menu-toggle{display:none}
}
@media(max-width:600px){.who{display:none}.main{padding:0 14px 40px}}

/* ---------- Komponen ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.panel-head h3{font-size:1.05rem;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.stat{background:linear-gradient(160deg,#1a1a20,#111115);border:1px solid var(--line);border-radius:18px;padding:20px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:rgba(225,6,0,.15)}
.stat span{font-size:.82rem;color:var(--muted);font-weight:600}
.stat b{display:block;font-size:2rem;font-weight:800;margin-top:6px}
.quick{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.latest-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.latest-item:first-child{border-top:0}
.latest-item small{color:var(--muted)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.toolbar .search{max-width:300px}
.toolbar.wrap label.inline{flex-direction:row;align-items:center;gap:8px;font-weight:600;font-size:.88rem}
.toolbar.wrap label.inline input,.toolbar.wrap label.inline select{width:auto;min-width:160px}
.spacer{flex:1}
.empty{padding:30px;text-align:center;color:var(--muted)}
.badge{padding:4px 10px;border-radius:999px;font-size:.74rem;font-weight:700;display:inline-block}
.badge.ok{background:rgba(34,197,94,.15);color:#4ade80}
.badge.warn{background:rgba(245,158,11,.15);color:#fbbf24}
.badge.info{background:rgba(59,130,246,.15);color:#60a5fa}
.badge.mute{background:#2a2a30;color:#aaa}

/* ---------- Pengaturan (form) ---------- */
.settings{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;gap:20px}
.field{display:grid;gap:8px}
.field-label small{display:block;color:var(--muted);font-weight:400;font-size:.8rem;margin-top:2px}
.field.row-bool{grid-template-columns:1fr auto;align-items:center}
.form-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;position:sticky;bottom:12px}
.form-actions .btn{box-shadow:0 14px 30px -12px rgba(0,0,0,.8)}
.group-title{font-size:.8rem;text-transform:uppercase;letter-spacing:.16em;color:var(--accent);font-weight:800;margin-top:6px}
.img-field{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.img-prev{width:150px;height:96px;border-radius:12px;background:#0d0d11;border:1px dashed rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.img-prev img{width:100%;height:100%;object-fit:cover}
.img-prev .icon{width:30px;height:30px;color:#666}
.img-ctrl{flex:1;min-width:200px;display:grid;gap:8px}
.switch{position:relative;display:inline-block;width:50px;height:28px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:#333;border-radius:999px;cursor:pointer;transition:.3s}
.switch span::before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::before{transform:translateX(22px)}
.row-switch{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600;font-size:.88rem;color:#ddd}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-stack{display:grid;gap:14px}

/* ---------- Produk ---------- */
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.pcard.off{opacity:.55}
.pc-img{aspect-ratio:4/3;background:#0d0d11;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pc-img img{width:100%;height:100%;object-fit:contain}
.pc-img .icon{width:48px;height:48px;color:#555}
.pc-body{padding:14px 16px;display:grid;gap:6px}
.pc-body h3{font-size:1rem;font-weight:700}
.pc-body .price{color:var(--accent);font-weight:800}
.pc-actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 16px;margin-top:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:100;display:grid;place-items:center;padding:16px}
.modal-box{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 30px 60px -20px #000}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-head h3{font-size:1.1rem;font-weight:800}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;flex-wrap:wrap}
.modal-prev{width:100%;max-height:200px;object-fit:contain;border-radius:12px;background:#0d0d11}
.dl{display:grid;grid-template-columns:130px 1fr;gap:10px 16px}
.dl dt{color:var(--muted);font-size:.9rem}
.dl dd{word-break:break-word}

/* ---------- Tabel booking ---------- */
.table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:760px}
.tbl th,.tbl td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;font-size:.92rem}
.tbl th{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:#0f0f13}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.tbl select{width:auto;min-width:150px;padding:8px 10px}
.tbl .acts{display:flex;gap:8px}

/* ---------- Overlay & notifikasi ---------- */
.loader{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:grid;place-items:center;color:#fff}
.spinner{width:46px;height:46px;border:4px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;right:20px;bottom:20px;padding:14px 18px;border-radius:14px;background:#1b1b21;border:1px solid var(--line);z-index:400;max-width:360px;font-weight:600;box-shadow:0 16px 40px rgba(0,0,0,.5);transform:translateY(160%);transition:.35s}
.toast.show{transform:none}
.toast.ok{border-color:var(--ok)}
.toast.err{border-color:var(--accent)}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.row2{grid-template-columns:1fr}.toast{left:14px;right:14px;max-width:none}}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<section id="loginView" class="login-wrap" hidden>

<!-- ===================== APLIKASI ===================== -->
<div id="appView" hidden>
  <aside class="sidebar" id="sidebar">

  </aside>
  <div class="overlay" id="overlay"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menuBtn" aria-label="Buka menu" type="button">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>

      <h1 id="pageTitle">Dashboard</h1>
      <div class="who" id="who"></div>

    <div id="page"></div>

</div>

<!-- Modal umum -->
<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="icon-btn" id="modalClose" type="button" aria-label="Tutup">✕</button>

<script type="module">

// ---------- Daftar (serialize / parse) ----------
function serializeList(type, v) {
  if (type === "points") return (v || []).join("\n");
  if (type === "features") return (v || []).map((f) => `${f.icon}|${f.title}`).join("\n");
  if (type === "nav") return (v || []).map((n) => `${n.label}|${n.target}|${n.show ? 1 : 0}`).join("\n");
  return "";
}
function parseList(type, s) {
  const lines = String(s || "").split("\n").map((l) => l.trim()).filter(Boolean);
  if (type === "points") return lines.slice(0, 8);
  if (type === "features") {
    return lines
      .map((l) => {
        const [ic, ...rest] = l.split("|");
        return { icon: (ic || "check").trim(), title: rest.join("|").trim() };
      })
      .filter((f) => f.title)
      .slice(0, 6);
  }
  if (type === "nav") {
    return lines
      .map((l) => {
        const [label, target, show] = l.split("|").map((x) => (x || "").trim());
        return { label, target: target || "#beranda", show: show !== "0" };
      })
      .filter((n) => n.label)
      .slice(0, 8);
  }
  return [];
}

// ---------- Komponen form pengaturan ----------
function fieldHtml(f) {
  const val = getPath(config, f.key);
  const id = "f_" + f.key.replace(/\./g, "_");
  switch (f.type) {
    case "textarea":
      return `<textarea id="${id}" data-key="${f.key}" rows="3">${esc(val ?? "")}</textarea>`;
    case "bool":
      return `<label class="switch"><input type="checkbox" id="${id}" data-key="${f.key}" ${val ? "checked" : ""}><span></span></label>`;
    case "color":
      return `<input type="color" id="${id}" data-key="${f.key}" value="${esc(val || DEFAULT_SITE.accentColor)}">`;
    case "image":
      return `
        <div class="img-field">
          <div class="img-prev">${val ? `<img src="${esc(val)}" alt="">` : icon("image")}</div>
          <div class="img-ctrl">
            <input type="url" data-key="${f.key}" value="${esc(val ?? "")}" placeholder="https://... (atau upload di kanan)">
            <label class="btn btn-ghost btn-sm" style="width:fit-content">
              ${icon("image")} Upload Gambar
              <input type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden data-upload="${f.key}" data-folder="${f.folder || "umum"}">
            </label>
          </div>
        </div>`;
    case "points":
    case "features":
    case "nav":
      return `<textarea id="${id}" data-key="${f.key}" data-kind="${f.type}" rows="5">${esc(serializeList(f.type, val))}</textarea>`;
    case "url":
      return `<input type="url" id="${id}" data-key="${f.key}" value="${esc(val ?? "")}" placeholder="https://...">`;
    default:
      return `<input type="text" id="${id}" data-key="${f.key}" value="${esc(val ?? "")}">`;
  }
}

function settingsForm(key) {
  const cfg = SETTINGS[key];
  const rows = cfg.fields
    .map((f) => {
      if (f.group) return `<h4 class="group-title">${esc(f.group)}</h4>`;
      const isBool = f.type === "bool";
      return `
        <div class="field ${isBool ? "row-bool" : ""}">
          <div class="field-label">
            <label for="f_${f.key.replace(/\./g, "_")}" style="flex-direction:column;gap:0">${esc(f.label)}
              ${f.hint ? `<small>${esc(f.hint)}</small>` : ""}
            </label>
          </div>
          ${fieldHtml(f)}
        </div>`;
    })
    .join("");
  return `
    <form id="settingsForm" class="settings" novalidate>
      ${rows}
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">${icon("check")} Simpan Perubahan</button>
      </div>
    </form>`;
}

function collectSettings(form, fields) {
  const out = {};
  for (const f of fields) {
    if (f.group) continue;
    const el = form.querySelector(`[data-key="${f.key}"]`);
    if (!el) continue;
    let value;
    if (f.type === "bool") value = el.checked;
    else if (["points", "features", "nav"].includes(f.type)) value = parseList(f.type, el.value);
    else value = el.value.trim();

    if (["url", "image"].includes(f.type) && value && !/^https:\/\/\S+$/.test(value)) {
      throw new Error(`"${f.label}" harus berupa link https:// yang valid.`);
    }
    if (f.type === "color" && !/^#[0-9a-fA-F]{6}$/.test(value)) {
      throw new Error("Warna aksen tidak valid.");
    }
    if (typeof value === "string" && value.length > 2000) {
      throw new Error(`"${f.label}" terlalu panjang.`);
    }
    setPath(out, f.key, value);
  }
  return out;
}

async function saveSettings(form, key) {
  let payload;
  try {
    payload = collectSettings(form, SETTINGS[key].fields);
  } catch (err) {
    toast(err.message, "err");
    return;
  }
  showLoader("Menyimpan perubahan...");
  try {
    await setDoc(doc(db, "site", "config"), { ...payload, updatedAt: serverTimestamp() }, { merge: true });
    toast("Perubahan berhasil disimpan dan langsung tampil di website.");
  } catch (err) {
    console.error(err);
    toast(errMsg(err), "err");
  } finally {
    hideLoader();
  }
}

function renderSettingsPage(key) {
  $("#page").innerHTML = settingsForm(key);
  $("#settingsForm").addEventListener("submit", (e) => {
    e.preventDefault();
    saveSettings(e.target, key);
  });

// ---------- Upload gambar ke Firebase Storage ----------
async function uploadFile(file, folder) {
  const allowed = ["image/jpeg", "image/png", "image/webp", "image/gif"];
  if (!allowed.includes(file.type)) throw new Error("Format harus JPG, PNG, WEBP, atau GIF.");
  if (file.size > 3 * 1024 * 1024) throw new Error("Ukuran file maksimal 3 MB.");

  const ext = ((file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "")) || "jpg";
  const path = `media/${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const storageRef = ref(storage, path);
  const task = uploadBytesResumable(storageRef, file, {
    contentType: file.type,
    cacheControl: "public,max-age=3600"
  });
  await new Promise((resolve, reject) => {
    task.on(
      "state_changed",
      (snap) => showLoader(`Mengunggah gambar... ${Math.round((snap.bytesTransferred / snap.totalBytes) * 100)}%`),
      reject,
      resolve
    );
  });
  return { url: await getDownloadURL(storageRef), path };
}

document.addEventListener("change", async (e) => {
  const input = e.target;
  if (!input.dataset?.upload) return;
  const file = input.files[0];
  if (!file) return;
  try {
    showLoader("Mengunggah gambar...");
    const { url } = await uploadFile(file, input.dataset.folder);
    const wrap = input.closest(".img-field");
    wrap.querySelector("input[data-key]").value = url;
    wrap.querySelector(".img-prev").innerHTML = `<img src="${esc(url)}" alt="">`;
    toast("Gambar berhasil diunggah. Klik Simpan Perubahan untuk menerapkan.");
  } catch (err) {
    toast(err.message || errMsg(err), "err");
  } finally {
    hideLoader();
    input.value = "";
  }
});

        </label>

        <textarea name="description" rows="3" maxlength="800">${esc(p?.description || "")}</textarea>
      </label>
      <div class="row2">
        <label>Urutan Tampil

        </div>
      </div>

      </div>
    </form>`);

  $("#prodCancel").addEventListener("click", closeModal);
  $("#prodForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const name = String(fd.get("name") || "").trim();
    const price = Math.round(Number(fd.get("price")));
    const stock = Math.floor(Number(fd.get("stock")));
    const order = Math.floor(Number(fd.get("order") || 0));
    const description = String(fd.get("description") || "").trim();
    const active = fd.get("active") === "on";
    const file = fd.get("photo");

    if (name.length < 2 || name.length > 120) return ($("#prodErr").textContent = "Nama produk wajib diisi (2–120 karakter).");
    if (!Number.isFinite(price) || price < 0) return ($("#prodErr").textContent = "Harga tidak valid.");
    if (!Number.isFinite(stock) || stock < 0) return ($("#prodErr").textContent = "Stok tidak valid.");
    if (!Number.isFinite(order) || order < 0) return ($("#prodErr").textContent = "Urutan tidak valid.");
    $("#prodErr").textContent = "";

    showLoader("Menyimpan produk...");
    try {
      let imageUrl = p?.imageUrl || "";

        const up = await uploadFile(file, "products");

        imagePath = up.path;
        uploaded = true;
      }
      const data = { name, price, stock, description, order, active, imageUrl, imagePath, updatedAt: serverTimestamp() };
      if (isNew) {
        await addDoc(collection(db, "products"), { ...data, createdAt: serverTimestamp() });
      } else {
        await updateDoc(doc(db, "products", p.id), data);
        if (uploaded && oldPath) deleteObject(ref(storage, oldPath)).catch(() => {});
      }
      closeModal();
      toast("Produk berhasil disimpan.");
    } catch (err) {
      console.error(err);
      $("#prodErr").textContent = err.message?.startsWith("Format") || err.message?.startsWith("Ukuran")
        ? err.message
        : errMsg(err);
    } finally {
      hideLoader();
    }
  });
}

async function toggleProduct(id) {
  const p = products.find((x) => x.id === id);
  if (!p) return;
  try {
    await updateDoc(doc(db, "products", id), { active: !p.active, updatedAt: serverTimestamp() });
    toast(p.active ? "Produk disembunyikan dari website." : "Produk ditampilkan di website.");
  } catch (err) {
    toast(errMsg(err), "err");
  }
}

async function moveProduct(id, dir) {
  const sorted = sortedProducts();
  const i = sorted.findIndex((p) => p.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= sorted.length) return;
  [sorted[i], sorted[j]] = [sorted[j], sorted[i]];
  const batch = writeBatch(db);
  sorted.forEach((p, idx) => batch.update(doc(db, "products", p.id), { order: idx, updatedAt: serverTimestamp() }));
  try {
    await batch.commit();
  } catch (err) {
    toast(errMsg(err), "err");
  }
}

async function deleteProduct(id) {
  const p = products.find((x) => x.id === id);
  if (!p || !confirm(`Hapus produk "${p.name}"? Tindakan ini tidak bisa dibatalkan.`)) return;
  showLoader("Menghapus produk...");
  try {
    await deleteDoc(doc(db, "products", id));
    if (p.imagePath) await deleteObject(ref(storage, p.imagePath)).catch(() => {});
    toast("Produk dihapus.");
  } catch (err) {
    toast(errMsg(err), "err");
  } finally {
    hideLoader();
  }
}

function bookingDetail(id) {
  const b = bookings.find((x) => x.id === id);
  if (!b) return;
  openModal("Detail Booking", `
    <dl class="dl">
      <dt>Nama</dt><dd>${esc(b.name)}</dd>
      <dt>WhatsApp</dt><dd><a class="red" href="${waLink(b.phone, "Halo, kami dari 3 GARAGE terkait booking servis Anda.")}" target="_blank" rel="noopener">${esc(b.phone)}</a></dd>
      <dt>Kendaraan</dt><dd>${esc(b.vehicleType)}</dd>
      <dt>Jenis Servis</dt><dd>${esc(b.serviceType)}</dd>
      <dt>Tanggal</dt><dd>${esc(b.date)}</dd>
      <dt>Keluhan</dt><dd>${esc(b.complaint || "-")}</dd>
      <dt>Status</dt><dd>${statusBadge(b.status)}</dd>
      <dt>Dikirim</dt><dd>${fmtDate(b.createdAt)}</dd>
    </dl>`);
}

async function updateBookingStatus(id, status) {
  try {
    await updateDoc(doc(db, "bookings", id), { status });
    toast(`Status booking diubah menjadi "${status}".`);
  } catch (err) {
    toast(errMsg(err), "err");
    drawBookings();
  }
}

async function deleteBooking(id) {
  const b = bookings.find((x) => x.id === id);
  if (!b || !confirm(`Hapus booking dari ${b.name}?`)) return;
  try {
    await deleteDoc(doc(db, "bookings", id));
    toast("Booking dihapus.");
  } catch (err) {
    toast(errMsg(err), "err");
  }
}

// ---------- Navigasi halaman ----------
const PAGES = {
  dashboard: { title: "Dashboard", render: renderDashboard },
  beranda: { title: "Pengaturan Beranda", render: () => renderSettingsPage("beranda") },
  produk: { title: "Manajemen Produk", render: renderProductsPage },
  booking: { title: "Manajemen Booking", render: renderBookingsPage },
  sosial: { title: "Sosial Media & Kontak", render: () => renderSettingsPage("sosial") },
  tentang: { title: "Pengaturan Tentang Kami", render: () => renderSettingsPage("tentang") },
  navigasi: { title: "Pengaturan Navigasi", render: () => renderSettingsPage("navigasi") },
  footer: { title: "Pengaturan Footer", render: () => renderSettingsPage("footer") },
  website: { title: "Pengaturan Website", render: () => renderSettingsPage("website") }
};

function closeSidebar() {
  $("#sidebar").classList.remove("open");
  $("#overlay").classList.remove("show");
}

function navigate(page) {
  if (!PAGES[page]) page = "dashboard";
  currentPage = page;
  document.querySelectorAll("#sideNav button").forEach((b) => b.classList.toggle("active", b.dataset.page === page));
  $("#pageTitle").textContent = PAGES[page].title;
  PAGES[page].render();
  window.scrollTo({ top: 0 });
  closeSidebar();
}

// Delegasi klik untuk seluruh isi halaman
$("#page").addEventListener("click", (e) => {
  const go = e.target.closest("[data-goto]");
  if (go) return navigate(go.dataset.goto);

  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const id = btn.dataset.id;
  switch (btn.dataset.act) {
    case "add": return productModal();
    case "edit": return productModal(products.find((p) => p.id === id));
    case "toggle": return toggleProduct(id);
    case "up": return moveProduct(id, -1);
    case "down": return moveProduct(id, 1);
    case "del": return deleteProduct(id);
    case "detail": return bookingDetail(id);
    case "bdel": return deleteBooking(id);
  }
});

$("#page").addEventListener("change", (e) => {
  if (e.target.matches(".status-sel")) return updateBookingStatus(e.target.dataset.id, e.target.value);
  if (e.target.matches("#fDate, #fStatus")) drawBookings();
});

$("#page").addEventListener("input", (e) => {
  if (e.target.matches("#fDate")) drawBookings();
});

$("#sideNav").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-page]");
  if (b) navigate(b.dataset.page);
});

$("#menuBtn").addEventListener("click", () => {
  $("#sidebar").classList.toggle("open");
  $("#overlay").classList.toggle("show");
});
$("#overlay").addEventListener("click", closeSidebar);
$("#modalClose").addEventListener("click", closeModal);
$("#modal").addEventListener("click", (e) => {
  if (e.target.id === "modal") closeModal();
});

// ---------- Login / logout ----------
$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#loginErr").textContent = "";
  const email = $("#loginEmail").value.trim();
  const pass = $("#loginPass").value;
  if (!email || !pass) {
    $("#loginErr").textContent = "Email dan password wajib diisi.";
    return;
  }
  $("#loginBtn").disabled = true;
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (err) {
    $("#loginErr").textContent = errMsg(err);
  } finally {
    $("#loginBtn").disabled = false;
  }
});

$("#logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  toast("Anda sudah logout.");
});

function showLogin() {
  $("#appView").hidden = true;
  $("#loginView").hidden = false;
  $("#loginPass").value = "";
}

function showApp(user) {
  $("#loginView").hidden = true;
  $("#appView").hidden = false;
  $("#who").textContent = user.email || "";
}

function startRealtime() {
  if (realtimeStarted) return;
  realtimeStarted = true;

  unsubs.push(
    onSnapshot(
      doc(db, "site", "config"),
      (snap) => {
        config = mergeSite(snap.exists() ? snap.data() : {});
        if (!firstConfigLoaded) {
          firstConfigLoaded = true;
          navigate(currentPage);
        }
      },
      (err) => toast(errMsg(err), "err")
    )
  );

  unsubs.push(
    onSnapshot(
      collection(db, "products"),
      (snap) => {
        products = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        if (currentPage === "produk") drawProducts();
      },
      (err) => toast(errMsg(err), "err")
    )
  );

  unsubs.push(
    onSnapshot(
      query(collection(db, "bookings"), orderBy("createdAt", "desc"), limit(300)),
      (snap) => {
        bookings = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        if (currentPage === "booking") drawBookings();
        if (currentPage === "dashboard") {
          renderLatest();
          loadStats();
        }
      },
      (err) => toast(errMsg(err), "err")
    )
  );
}

function stopRealtime() {
  unsubs.forEach((u) => u());
  unsubs = [];
  realtimeStarted = false;
  firstConfigLoaded = false;
  products = [];
  bookings = [];
}

// ---------- Guard autentikasi ----------
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    stopRealtime();
    showLogin();
    return;
  }
  let isAdmin = false;
  try {
    isAdmin = (await getDoc(doc(db, "admins", user.uid))).exists();
  } catch {
    isAdmin = false;
  }
  if (!isAdmin) {
    await signOut(auth);
    showLogin();
    $("#loginErr").textContent = "Akun ini tidak memiliki akses admin.";
    return;
  }
  showApp(user);
  startRealtime();
});
</script>
