<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e10600">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="3 GARAGE">
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));}</script>
<title>3 GARAGE - Subaru & Mazda Specialist</title>
<style>
:root{
  --accent:#e10600;
  --bg:#050506;
  --text:#f5f5f7;
  --muted:#a1a1aa;
  --line:rgba(255,255,255,.1);
  --glass:rgba(22,22,26,.58);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
.wrap{width:min(1200px,calc(100% - 32px));margin:0 auto}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon.big{width:44px;height:44px}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:50;background:rgba(5,5,6,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:72px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-style:italic;letter-spacing:.5px}
.logo .mark{color:var(--accent);font-size:30px;line-height:1}
.logo img{height:40px;width:auto}
.logo small{display:block;font-size:9px;letter-spacing:1px;font-weight:600;color:var(--muted);font-style:normal}
.nav{display:flex;gap:26px}
.nav a{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#d4d4d8;padding:8px 0;border-bottom:2px solid transparent;transition:.2s}
.nav a:hover,.nav a.active{color:#fff;border-color:var(--accent)}
.nav a.active .icon{color:var(--accent)}
.burger{background:none;border:0;color:#fff;padding:6px;display:none}
.menu{position:absolute;right:16px;top:70px;width:240px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:14px;padding:8px;display:none;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.menu.open{display:block}
.menu a{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:10px;font-size:14px}
.menu a:hover{background:rgba(255,255,255,.06)}
@media(max-width:860px){.nav{display:none}.burger{display:block}}

/* ---------- Tombol ---------- */
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:12px;font-weight:700;font-size:15px;border:1px solid transparent;transition:.2s}
.btn-red{background:var(--accent);color:#fff;box-shadow:0 10px 30px rgba(225,6,0,.35)}
.btn-red:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.04);color:#fff;border-color:rgba(255,255,255,.7)}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn-line{background:transparent;color:#fff;border-color:var(--accent);padding:10px 16px;font-size:14px}
.btn-line:hover{background:var(--accent)}
.btn:disabled{opacity:.6;cursor:not-allowed}

/* ---------- Hero ---------- */
.hero{position:relative;min-height:calc(100vh - 72px);min-height:min(640px,calc(100svh - 72px));display:flex;align-items:center;background:#0a0a0c center/cover no-repeat;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,5,6,.96) 0%,rgba(5,5,6,.7) 45%,rgba(5,5,6,.25) 100%);z-index:1}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.hero .wrap{position:relative;z-index:2;padding:60px 0}
.hero h1{font-size:clamp(56px,11vw,128px);font-weight:900;font-style:italic;letter-spacing:-2px;line-height:.9}
.hero h1 span{color:var(--accent)}
.hero h2{font-size:clamp(16px,2.6vw,26px);font-weight:800;font-style:italic;letter-spacing:1px;margin-top:14px}
.hero .tag{color:var(--accent);font-weight:800;letter-spacing:2px;margin:18px 0 10px;font-size:clamp(13px,1.8vw,16px)}
.hero .slogan{color:#d4d4d8;font-size:clamp(15px,2vw,19px);margin-bottom:28px}
.hero .actions{display:flex;gap:14px;flex-wrap:wrap}
@media(max-width:600px){.hero .actions .btn{flex:1;justify-content:center;padding:13px 14px;font-size:14px}}

/* ---------- Section umum ---------- */
section{padding:56px 0}
.title{display:flex;align-items:center;gap:12px;font-size:clamp(20px,3vw,28px);font-weight:900;letter-spacing:.5px}
.title::before{content:"";width:5px;height:26px;background:var(--accent);border-radius:2px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}

/* ---------- Tentang ---------- */
.about{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.about .content h3{font-size:clamp(22px,3vw,32px);font-weight:900;margin-bottom:12px}
.about .content h3 em{color:var(--accent);font-style:normal}
.about .content p{color:#d4d4d8;margin-bottom:16px}
.about ul{list-style:none;margin:14px 0 22px}
.about li{display:flex;gap:10px;align-items:center;margin:8px 0;color:#e4e4e7}
.about li::before{content:"✔";color:#fff;background:var(--accent);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:none}
.video{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#111}
.video iframe{width:100%;height:100%;border:0}
.video .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.feat{padding:22px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.feat .icon{color:#fff;width:40px;height:40px}
.feat b{font-size:14px;font-weight:800;line-height:1.25}
@media(max-width:860px){.about{grid-template-columns:1fr}}
@media(max-width:520px){.features{grid-template-columns:1fr 1fr}.features .feat:last-child{grid-column:span 2}}

/* ---------- Produk ---------- */
.head-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.head-row a{color:var(--muted);font-size:14px;display:inline-flex;gap:6px;align-items:center}
.head-row a:hover{color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.prod{padding:14px;display:flex;flex-direction:column;gap:10px;transition:.25s}
.prod:hover{transform:translateY(-4px);border-color:rgba(225,6,0,.5)}
.prod .img{height:150px;border-radius:12px;background:#0e0e10 center/contain no-repeat;display:grid;place-items:center;color:#52525b;font-size:12px}
.prod h4{font-size:15px;font-weight:700;line-height:1.3;min-height:40px}
.prod .desc{color:var(--muted);font-size:13px;min-height:0}
.prod .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.price{color:var(--accent);font-weight:800;font-size:17px}
.stock{font-size:12px;background:rgba(255,255,255,.08);padding:3px 9px;border-radius:999px;color:#e4e4e7}
.stock.habis{background:rgba(225,6,0,.2);color:#fca5a5}
.prod .btn{justify-content:center;font-size:13px;padding:10px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.45);color:#bbf7d0;border-radius:10px}
.empty{color:var(--muted);text-align:center;padding:30px;grid-column:1/-1}

/* ---------- Booking & sosial ---------- */
.split{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:stretch}
.booking{position:relative;overflow:hidden;border-color:rgba(225,6,0,.45);min-height:100%}
.booking .bg{position:absolute;inset:0;background:#0a0a0c center/cover;opacity:.35}
.booking .inner{position:relative;padding:28px}
.booking .head{display:flex;gap:12px;align-items:center;color:var(--accent);margin-bottom:6px}
.booking h3{font-size:clamp(20px,2.6vw,26px);font-weight:900}
.booking p.lead{color:#d4d4d8;margin:8px 0 18px}
form.bf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.bf .full{grid-column:1/-1}
form.bf label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
form.bf input,form.bf select,form.bf textarea{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:12px;font:inherit;font-size:14px;width:100%}
form.bf input:focus,form.bf select:focus,form.bf textarea:focus{outline:none;border-color:var(--accent)}
form.bf select option{background:#111}
form.bf textarea{min-height:80px;resize:vertical}
form.bf .btn{grid-column:1/-1;justify-content:center}
.msg{grid-column:1/-1;font-size:14px;border-radius:10px;padding:10px 12px;display:none}
.msg.ok{display:block;background:rgba(34,197,94,.15);color:#bbf7d0;border:1px solid rgba(34,197,94,.4)}
.msg.err{display:block;background:rgba(225,6,0,.15);color:#fecaca;border:1px solid rgba(225,6,0,.45)}
.msg a{color:#fff;text-decoration:underline}
@media(max-width:860px){.split{grid-template-columns:1fr}}
@media(max-width:520px){form.bf{grid-template-columns:1fr}}

.socials{display:flex;flex-direction:column;gap:12px}
.soc{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;border:1px solid var(--line);transition:.2s;background:var(--glass)}
.soc:hover{border-color:rgba(225,6,0,.6);transform:translateX(3px)}
.soc .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.06)}
.soc .ic .icon{width:22px;height:22px}
.soc .t{flex:1;min-width:0}
.soc .t b{display:block;font-size:15px}
.soc .t span{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.soc.ig{background:linear-gradient(120deg,#833ab4,#fd1d1d 60%,#fcb045)}
.soc.tt{background:#111}
.soc.yt{background:#7f1d1d}
.soc.wa{background:#15803d}

/* ---------- Video Bengkel ---------- */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.vid{padding:12px;display:flex;flex-direction:column;gap:10px;margin:0}
.vid video{width:100%;border-radius:12px;background:#000;aspect-ratio:16/9}
.vid .video{border-radius:12px}
.vid figcaption{font-weight:800;font-size:15px}
.vid p{color:var(--muted);font-size:13px}

/* ---------- Footer ---------- */
footer{border-top:1px solid var(--line);padding:28px 0;background:#030303}
.foot{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.foot .links{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.foot .links a:hover{color:#fff}
.foot .meta{color:var(--muted);font-size:13px}
.foot .meta div+div{margin-top:4px}
.copy{color:#71717a;font-size:12px;margin-top:16px;text-align:center}

/* ---------- Mode perawatan ---------- */
.maint{position:fixed;inset:0;z-index:100;background:rgba(5,5,6,.96);display:grid;place-items:center;text-align:center;padding:24px}
.maint h2{font-size:28px;font-weight:900;margin-bottom:12px}
.maint h2 span{color:var(--accent)}
.maint p{color:#d4d4d8;max-width:460px;margin:0 auto}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:90}
.toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a href="#beranda" class="logo" id="logo"></a>
    <nav class="nav" id="nav"></nav>
    <button class="burger" id="burger" aria-label="Menu"></button>
    <div class="menu" id="menu"></div>
  </div>
</header>

<main>

  <!-- Beranda / Hero -->
  <div id="beranda" data-section="hero" class="hero" style="background-image:none">
    <div class="wrap reveal">
      <h1 id="heroTitle"></h1>
      <h2 id="heroSubtitle"></h2>
      <div class="tag" id="heroTagline"></div>
      <p class="slogan" id="heroSlogan"></p>
      <div class="actions">
        <a href="#booking" class="btn btn-red" id="heroBtnBooking"></a>
        <a href="#produk" class="btn btn-ghost" id="heroBtnCatalog"></a>
        <a href="index2.html" class="btn btn-ghost"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"/></svg> Video Bengkel</a>
      </div>
    </div>
  </div>

  <!-- Tentang Kami -->
  <section id="tentang" data-section="about">
    <div class="wrap about">
      <div class="video reveal" id="video"></div>
      <div class="content reveal">
        <h3 id="aboutTitle"></h3>
        <p id="aboutDesc"></p>
        <ul id="aboutPoints"></ul>
        <a href="#booking" class="btn btn-line" id="aboutBtn"></a>
        <div class="features" id="aboutFeatures"></div>
      </div>
    </div>
  </section>

  <!-- Produk -->
  <section id="produk" data-section="products">
    <div class="wrap">
      <div class="head-row reveal">
        <h2 class="title" id="productsTitle"></h2>
        <a href="#produk">Lihat Semua →</a>
      </div>
      <div class="grid" id="productGrid"></div>
    </div>
  </section>

  <!-- Video Bengkel -->
  <section id="videos" data-section="videos" hidden>
    <div class="wrap">
      <div class="head-row reveal">
        <h2 class="title">VIDEO BENGKEL KAMI</h2>
      </div>
      <div class="vgrid" id="videoGrid"></div>
    </div>
  </section>

  <!-- Booking -->
  <section id="booking" data-section="booking">
    <div class="wrap split">
      <div class="card booking reveal">
        <div class="bg" id="bookingBg"></div>
        <div class="inner">
          <div class="head">
            <svg class="icon big" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          </div>
          <h3 id="bannerTitle"></h3>
          <p class="lead" id="bannerDesc"></p>
          <form class="bf" id="bookingForm" novalidate>
            <label>Nama
              <input name="name" required maxlength="80" autocomplete="name" placeholder="Nama lengkap">
            </label>
            <label>No. WhatsApp
              <input name="phone" required inputmode="tel" maxlength="20" autocomplete="tel" placeholder="08xxxxxxxxxx">
            </label>
            <label>Jenis Mobil
              <input name="vehicleType" required maxlength="60" placeholder="Contoh: Subaru WRX / Mazda CX-5">
            </label>
            <label>Jenis Servis
              <select name="serviceType" id="serviceType" required></select>
            </label>
            <label>Tanggal Servis
              <input name="date" type="date" required>
            </label>
            <label class="full">Keluhan (opsional)
              <textarea name="complaint" maxlength="500" placeholder="Ceritakan keluhan mobil Anda"></textarea>
            </label>
            <button class="btn btn-red" type="submit" id="bookBtn">Booking Sekarang →</button>
            <div class="msg" id="bookMsg"></div>
          </form>
        </div>
      </div>

      <div class="socials reveal" id="sosial" data-section="social">
        <div id="socialList" style="display:contents"></div>
      </div>
    </div>
  </section>

</main>

<footer>
  <div class="wrap">
    <div class="foot">
      <div class="links" id="footLinks"></div>
      <div class="meta" id="footMeta"></div>
    </div>
    <div class="copy" id="copyright"></div>
  </div>
</footer>

<div class="maint" id="maint" hidden>
  <div>
    <h2>3 <span>GARAGE</span></h2>
    <p id="maintMsg"></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, collection, query, where, onSnapshot,
  addDoc, updateDoc, setDoc, increment, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  firebaseConfig, SERVICE_TYPES, esc, safeCssUrl, safeHttpUrl, rupiah, waLink,
  ytId, normalizePhone, isValidPhone, todayStr, mergeSite, icon
} from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const $ = (id) => document.getElementById(id);
const SITE_REF = doc(db, "site", "config");

let site = mergeSite({});
let products = [];
let isAdminUser = false;

/* ---------- Render konfigurasi situs ---------- */
function renderSite() {
  document.documentElement.style.setProperty("--accent", site.accentColor || "#e10600");

  const visibleNav = (site.nav || []).filter((n) => n.show !== false);
  const navHtml = visibleNav.map((n) => `<a href="${esc(n.target)}">${esc(n.label)}</a>`).join("");
  $("nav").innerHTML = navHtml;
  $("menu").innerHTML = visibleNav.map((n) => `<a href="${esc(n.target)}">${esc(n.label)}</a>`).join("")
    + `<a href="admin.html">${icon("user")} Login Admin</a>`;

  $("logo").innerHTML = site.logoUrl && safeHttpUrl(site.logoUrl)
    ? `<img src="${esc(safeHttpUrl(site.logoUrl))}" alt="3 GARAGE">`
    : `<span><span class="mark">3</span> GARAGE</span><small>SUBARU • MAZDA SPECIALIST</small>`;

  // Hero
  const hero = $("beranda");
  hero.style.backgroundImage = site.heroBgUrl ? `url("${safeCssUrl(site.heroBgUrl)}")` : "";
  $("heroTitle").innerHTML = `<span>3</span> ${esc(site.heroTitle).replace(/^3\s*/, "")}`;
  $("heroSubtitle").textContent = site.heroSubtitle;
  $("heroTagline").textContent = site.heroTagline;
  $("heroSlogan").textContent = site.heroSlogan;
  $("heroBtnBooking").innerHTML = `${esc(site.heroBtnBooking)} ${icon("arrowRight")}`;
  $("heroBtnCatalog").innerHTML = `${icon("box")} ${esc(site.heroBtnCatalog)} ${icon("arrowRight")}`;

  // Tentang
  const vid = ytId(site.youtubeUrl);
  $("video").innerHTML = vid
    ? `<iframe src="https://www.youtube.com/embed/${vid}" title="Video 3 GARAGE" allowfullscreen loading="lazy"></iframe>`
    : `<div class="ph">Tambahkan URL YouTube di panel admin</div>`;
  const hl = site.aboutHighlight
    ? `<em>${esc(site.aboutHighlight)}</em>` : "";
  $("aboutTitle").innerHTML = `${esc(site.aboutTitle)} ${hl}`;
  $("aboutDesc").innerHTML = esc(site.aboutDesc);
  $("aboutPoints").innerHTML = (site.aboutPoints || []).map((p) => `<li>${esc(p)}</li>`).join("");
  $("aboutBtn").innerHTML = `${esc(site.aboutBtn)} ${icon("arrowRight")}`;
  $("aboutFeatures").innerHTML = (site.aboutFeatures || []).map((f) =>
    `<div class="card feat">${icon(f.icon)}<b>${esc(f.title)}</b></div>`).join("");

  // Produk
  $("productsTitle").textContent = site.productsTitle;
  renderProducts();

  // Booking
  $("bookingBg").style.backgroundImage = site.bannerUrl ? `url("${safeCssUrl(site.bannerUrl)}")` : "";
  $("bannerTitle").textContent = site.bannerTitle;
  $("bannerDesc").textContent = site.bannerDesc;

  // Sosial
  const s = site.socials || {};
  const soc = [
    ["instagram", "ig", "Instagram", s.instagram],
    ["tiktok", "tt", "TikTok", s.tiktok],
    ["youtube", "yt", "YouTube", s.youtube],
    ["whatsapp", "wa", "WhatsApp", s.whatsapp]
  ];
  $("socialList").innerHTML = soc
    .filter(([, , , v]) => v && v.show !== false && (v.url || v.label))
    .map(([key, cls, name, v]) => {
      const href = key === "whatsapp" && !/^https?:/i.test(v.url || "")
        ? waLink(site.whatsappNumber || v.url, "Halo 3 GARAGE, saya ingin bertanya.")
        : safeHttpUrl(v.url) || "#";
      return `<a class="soc ${cls}" href="${esc(href)}" target="_blank" rel="noopener">
        <span class="ic">${icon(key)}</span>
        <span class="t"><b>${esc(name)}</b><span>${esc(v.label || "")}</span></span>
        ${icon("arrowRight")}
      </a>`;
    }).join("") || `<p class="card" style="padding:18px;color:var(--muted)">Belum ada akun sosial media.</p>`;

  // Footer
  $("footLinks").innerHTML = visibleNav.map((n) => `<a href="${esc(n.target)}">${esc(n.label)}</a>`).join("");
  $("footMeta").innerHTML = [site.footerContact, site.footerAddress]
    .filter(Boolean).map((t) => `<div>${esc(t)}</div>`).join("");
  $("copyright").textContent = site.copyright;

  // Tampilkan / sembunyikan bagian
  for (const k of Object.keys(site.sections || {})) {
    document.querySelector(`[data-section="${k}"]`)?.toggleAttribute("hidden", !site.sections[k]);
  }
  // Booking & sosial: sembunyikan kalau booking dimatikan
  observeReveal();
}

function renderProducts() {
  const grid = $("productGrid");
  if (!products.length) {
    grid.innerHTML = `<div class="empty">Produk akan segera tersedia.</div>`;
    return;
  }
  grid.innerHTML = products.map((p) => {
    const out = Number(p.stock) <= 0;
    const img = safeHttpUrl(p.imageUrl);
    const wa = waLink(site.whatsappNumber, `Halo 3 GARAGE, saya ingin memesan ${p.name}.`);
    return `<article class="card prod">
      <div class="img" style="${img ? `background-image:url('${esc(safeCssUrl(img))}')` : ""}">${img ? "" : "Foto produk"}</div>
      <h4>${esc(p.name)}</h4>
      ${p.description ? `<div class="desc">${esc(p.description)}</div>` : ""}
      <div class="row">
        <span class="price">${rupiah(p.price)}</span>
        <span class="stock ${out ? "habis" : ""}">${out ? "Habis" : "Stok: " + esc(p.stock)}</span>
      </div>
      <a class="btn" href="${esc(site.whatsappNumber ? wa : "#")}" target="_blank" rel="noopener">${icon("whatsapp")} Pesan via WA</a>
    </article>`;
  }).join("");
}

/* ---------- Animasi muncul saat scroll ---------- */
const io = new IntersectionObserver((entries) => {
  for (const e of entries) if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
}, { threshold: .12 });
function observeReveal() {
  document.querySelectorAll(".reveal:not(.in)").forEach((el) => io.observe(el));
}

/* ---------- Menu hamburger ---------- */
$("burger").innerHTML = icon("menu");
$("burger").addEventListener("click", () => $("menu").classList.toggle("open"));
$("menu").addEventListener("click", (e) => { if (e.target.closest("a")) $("menu").classList.remove("open"); });
document.addEventListener("click", (e) => {
  if (!e.target.closest("#menu") && !e.target.closest("#burger")) $("menu").classList.remove("open");
});

/* ---------- Form booking ---------- */
$("serviceType").innerHTML = SERVICE_TYPES.map((s) => `<option>${esc(s)}</option>`).join("");
const dateInput = document.querySelector('input[name="date"]');
dateInput.min = todayStr();

function showMsg(html, ok) {
  const m = $("bookMsg");
  m.className = "msg " + (ok ? "ok" : "err");
  m.innerHTML = html;
}

$("bookingForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  const val = (n) => String(f.elements[n].value || "").trim();
  const data = {
    name: val("name"),
    phone: normalizePhone(val("phone")),
    vehicleType: val("vehicleType"),
    serviceType: val("serviceType"),
    date: val("date"),
    complaint: val("complaint")
  };

  if (data.name.length < 2) return showMsg("Nama minimal 2 karakter.", false);
  if (!isValidPhone(data.phone)) return showMsg("Nomor WhatsApp tidak valid. Contoh: 081234567890", false);
  if (data.vehicleType.length < 2) return showMsg("Isi jenis mobil Anda.", false);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(data.date)) return showMsg("Pilih tanggal servis.", false);
  if (data.date < todayStr()) return showMsg("Tanggal servis tidak boleh di masa lalu.", false);

  const btn = $("bookBtn");
  btn.disabled = true;
  btn.textContent = "Mengirim...";
  try {
    await addDoc(collection(db, "bookings"), {
      ...data,
      status: "Menunggu",
      createdAt: serverTimestamp()
    });
    const text = `Halo 3 GARAGE, saya ${data.name} ingin booking ${data.serviceType} untuk ${data.vehicleType} pada ${data.date}.`;
    const wa = site.whatsappNumber ? waLink(site.whatsappNumber, text) : "";
    showMsg(`Booking berhasil dikirim. Kami akan menghubungi Anda.` +
      (wa ? ` <a href="${esc(wa)}" target="_blank" rel="noopener">Konfirmasi via WhatsApp →</a>` : ""), true);
    f.reset();
    dateInput.min = todayStr();
  } catch (err) {
    console.error(err);
    showMsg("Gagal mengirim booking. Coba lagi beberapa saat.", false);
  } finally {
    btn.disabled = false;
    btn.innerHTML = "Booking Sekarang →";
  }
});

/* ---------- Penghitung kunjungan (sekali per sesi browser) ---------- */
async function countVisit() {
  try {
    if (sessionStorage.getItem("v3g-visit")) return;
    sessionStorage.setItem("v3g-visit", "1");
  } catch { /* penyimpanan diblokir: tetap hitung */ }
  const ref = doc(db, "stats", "visits");
  try {
    await updateDoc(ref, { count: increment(1) });
  } catch {
    try { await setDoc(ref, { count: 1 }); } catch { /* abaikan */ }
  }
}

/* ---------- Mode perawatan ---------- */
function applyMaintenance() {
  const show = !!site.maintenance && !isAdminUser;
  $("maintMsg").textContent = site.maintenanceMsg;
  $("maint").hidden = !show;
}

/* ---------- Data realtime ---------- */
onSnapshot(SITE_REF, (snap) => {
  try { site = mergeSite(snap.exists() ? snap.data() : {}); }
  catch (e) { console.error(e); site = mergeSite({}); }
  renderSite();
  applyMaintenance();
}, (err) => console.error("site:", err));

onSnapshot(query(collection(db, "products"), where("active", "==", true)), (snap) => {
  products = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  renderProducts();
}, (err) => console.error("products:", err));

onAuthStateChanged(auth, async (u) => {
  isAdminUser = false;
  if (u) {
    try { isAdminUser = (await getDoc(doc(db, "admins", u.uid))).exists(); }
    catch { isAdminUser = false; }
  }
  applyMaintenance();
});

/* ---------- Video Bengkel (realtime) ---------- */
onSnapshot(query(collection(db, "videos"), where("active", "==", true)), (snap) => {
  const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  $("videoGrid").innerHTML = list.map((v) => {
    const desc = v.description ? `<p>${esc(v.description)}</p>` : "";
    if (v.type === "file") {
      const u = safeHttpUrl(v.fileUrl);
      if (!u) return "";
      return `<figure class="card vid">
        <video controls playsinline preload="metadata" src="${esc(u)}"></video>
        <figcaption>${esc(v.title)}</figcaption>${desc}</figure>`;
    }
    const id = ytId(v.youtubeUrl);
    if (!id) return "";
    return `<figure class="card vid">
      <div class="video"><iframe src="https://www.youtube.com/embed/${id}" title="${esc(v.title)}" allowfullscreen loading="lazy"></iframe></div>
      <figcaption>${esc(v.title)}</figcaption>${desc}</figure>`;
  }).join("");
  $("videos").hidden = list.length === 0;
  observeReveal();
}, (err) => console.error("videos:", err));

countVisit();
observeReveal();
</script>
</body>
</html>
