<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3 GARAGE - Subaru & Mazda Specialist</title>
<meta name="description" content="3 GARAGE - Subaru & Mazda Specialist. Servis, sparepart, dan performance.">
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#e10600;
  --bg:#07080a;
  --line:rgba(255,255,255,.12);
  --muted:rgba(255,255,255,.68);
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#fff;overflow-x:hidden;line-height:1.55}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}
[hidden]{display:none!important}
.container{width:min(1280px,92%);margin:0 auto}
.red{color:var(--accent)}
.muted{color:var(--muted)}
.icon{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

.glass{background:rgba(18,18,22,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--radius)}

/* ---------- Tombol ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 22px;border-radius:999px;font-weight:700;border:1px solid transparent;cursor:pointer;transition:.3s;white-space:nowrap;text-align:center}
.btn .icon{width:18px;height:18px}
.btn-primary{background:linear-gradient(135deg,var(--accent),#ff3b30);color:#fff;box-shadow:0 12px 30px -12px var(--accent)}
.btn-primary:hover{transform:translateY(-2px);filter:brightness(1.12)}
.btn-ghost{background:rgba(0,0,0,.35);color:#fff;border-color:rgba(255,255,255,.6);backdrop-filter:blur(8px)}
.btn-ghost:hover{background:rgba(255,255,255,.12);border-color:#fff;transform:translateY(-2px)}
.btn-outline{background:rgba(225,6,0,.08);color:#fff;border-color:var(--accent)}
.btn-outline:hover{background:var(--accent)}
.btn-wa{background:#16a34a;color:#fff}
.btn-wa:hover{background:#15803d}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.link-btn{background:none;border:0;color:#fff;cursor:pointer;font-weight:600;font-size:.92rem;display:inline-flex;gap:6px;align-items:center}
.link-btn:hover{color:var(--accent)}

/* ---------- Form ---------- */
input,select,textarea{width:100%;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:12px 14px;outline:none;transition:.25s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(225,6,0,.2)}
select option{background:#111}
textarea{resize:vertical}

/* ---------- Header ---------- */
.site-header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:20px;padding:14px 4%;background:linear-gradient(#000d,#0004);backdrop-filter:blur(6px);transition:.35s}
.site-header.scrolled{background:rgba(5,5,6,.92);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.brand{display:flex;align-items:center;min-width:0}
.brand img{height:50px;width:auto}
.logo-text{font-family:Orbitron,Inter,sans-serif;font-size:1.6rem;font-weight:800;font-style:italic;line-height:1}
.logo-text b{color:var(--accent)}
.logo-text small{display:block;font-family:Inter,sans-serif;font-size:.45rem;letter-spacing:.22em;font-style:normal;opacity:.85;margin-top:4px}
.main-nav{display:flex;gap:4px;margin:0 auto}
.nav-link{position:relative;display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:600;font-size:.92rem;color:#e5e5e5;transition:.3s}
.nav-link .icon{width:18px;height:18px}
.nav-link:hover{color:#fff}
.nav-link.active{color:var(--accent)}
.nav-link.active::after{content:"";position:absolute;left:14px;right:14px;bottom:-8px;height:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.burger{width:44px;height:44px;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 10px;margin-left:auto;flex-shrink:0}
.burger span{height:2px;background:#fff;border-radius:2px;transition:.3s}
.burger.open span:nth-child(1){transform:translateY(8px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
.dropdown{position:absolute;top:calc(100% + 10px);right:4%;width:250px;padding:10px;opacity:0;visibility:hidden;transform:translateY(-8px);transition:.3s}
.dropdown.open{opacity:1;visibility:visible;transform:none}
.dd-link{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;font-weight:600;font-size:.92rem;transition:.2s}
.dd-link:hover{background:rgba(255,255,255,.08);color:var(--accent)}
.dd-link .icon{width:20px;height:20px}
@media(max-width:1000px){.main-nav{display:none}}

/* ---------- Hero ---------- */
.hero{position:relative;min-height:min(100vh,800px);display:flex;align-items:center;padding:120px 0 80px;overflow:hidden;background:#050506}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.05);animation:zoom 20s ease-in-out infinite alternate}
@keyframes zoom{to{transform:scale(1.12)}}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,5,6,.96) 8%,rgba(5,5,6,.6) 55%,rgba(5,5,6,.15)),linear-gradient(0deg,#07080a 0%,transparent 40%)}
.hero-content{position:relative;z-index:2}
.hero-title{font-family:Orbitron,Inter,sans-serif;font-weight:800;font-size:clamp(3rem,8vw,6.5rem);letter-spacing:.02em;line-height:1;text-shadow:0 6px 30px rgba(0,0,0,.6);animation:rise .9s both}
.hero-title::first-letter{color:var(--accent)}
.hero-sub{font-weight:800;font-size:clamp(1.05rem,2.6vw,2rem);letter-spacing:.12em;margin-top:8px;animation:rise .9s .1s both}
.hero-tag{color:var(--accent);font-weight:700;letter-spacing:.28em;font-size:clamp(.78rem,1.6vw,1.05rem);margin:22px 0 12px;animation:rise .9s .2s both}
.hero-slogan{font-size:clamp(1rem,2vw,1.35rem);color:#f5f5f5;animation:rise .9s .3s both}
.hero-btns{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px;animation:rise .9s .4s both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media(max-width:700px){.hero-btns .btn{flex:1 1 100%}}

/* ---------- Section umum ---------- */
section{position:relative;padding:76px 0}
.sec-title{font-weight:800;font-size:clamp(1.3rem,3vw,2rem);letter-spacing:.02em;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sec-title .bar{width:5px;height:26px;background:var(--accent);border-radius:3px}
.reveal{opacity:0;transform:translateY(30px);transition:.8s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

/* ---------- Tentang ---------- */
.about{background:radial-gradient(circle at 85% 50%,rgba(225,6,0,.12),transparent 50%),#0b0b0e}
.about-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:44px;align-items:center}
.video-card{aspect-ratio:16/9;overflow:hidden;padding:0;position:relative}
.video-card iframe,.video-card img{width:100%;height:100%;object-fit:cover;border:0}
.video-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted)}
.video-empty .icon{width:48px;height:48px;color:var(--accent)}
.about h2{font-size:clamp(1.6rem,3.4vw,2.4rem);font-weight:800;margin-bottom:14px;line-height:1.2}
.about-desc{color:var(--muted);margin-bottom:18px}
.checks{list-style:none;display:grid;gap:12px;margin-bottom:28px}
.checks li{display:flex;gap:12px;align-items:flex-start}
.checks .icon{width:22px;height:22px;color:#fff;background:var(--accent);border-radius:50%;padding:4px}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:44px}
.feature{padding:28px 14px;text-align:center;transition:.35s}
.feature:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 20px 40px -20px rgba(225,6,0,.5)}
.feature .icon{width:42px;height:42px;color:#fff;margin:0 auto 14px}
.feature h3{font-size:1rem;font-weight:700}
@media(max-width:820px){.about-grid{grid-template-columns:1fr}}
@media(max-width:520px){.feature{padding:20px 8px}.feature h3{font-size:.85rem}.feature .icon{width:32px;height:32px}}

/* ---------- Produk ---------- */
.products{background:#070708}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;gap:12px;flex-wrap:wrap}
.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.product{padding:16px;display:flex;flex-direction:column;gap:10px;transition:.35s}
.product:hover{transform:translateY(-6px);border-color:rgba(225,6,0,.6);box-shadow:0 20px 40px -20px rgba(225,6,0,.5)}
.p-img{aspect-ratio:4/3;border-radius:14px;background:radial-gradient(circle,#2a2a30,#0c0c10);display:flex;align-items:center;justify-content:center;overflow:hidden}
.p-img img{width:100%;height:100%;object-fit:contain;transition:.4s}
.product:hover .p-img img{transform:scale(1.06)}
.p-img .icon{width:56px;height:56px;color:#777}
.product h3{font-size:1rem;font-weight:700;line-height:1.3}
.p-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.price{color:var(--accent);font-weight:800}
.stock{font-size:.75rem;background:#16a34a;padding:4px 10px;border-radius:999px;font-weight:700}
.stock.out{background:#555}
.p-desc{font-size:.85rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product .btn{padding:11px 14px;font-size:.88rem;margin-top:auto}
.empty{padding:30px;text-align:center;color:var(--muted);grid-column:1/-1}
@media(max-width:1000px){.product-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.product-grid{gap:12px}.product{padding:12px}}

/* ---------- Booking ---------- */
.booking{background:#0a0a0c}
.booking-wrap{position:relative;overflow:hidden;padding:40px;border-color:rgba(225,6,0,.5)}
.booking-banner{position:absolute;top:0;bottom:0;right:0;left:42%;background:#111 center/cover no-repeat}
.booking-banner::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0c0c0f 0%,rgba(12,12,15,.4) 60%,rgba(12,12,15,.1))}
.booking-body{position:relative;z-index:1;max-width:56%}
.booking-body p{color:var(--muted);margin-top:10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin:22px 0 10px}
.form-grid label{display:flex;flex-direction:column;gap:7px;font-size:.85rem;font-weight:600;color:#ddd}
.form-grid .full{grid-column:1/-1}
.field-error{color:#ff7b7b;min-height:22px;font-size:.9rem;margin-bottom:8px}
.booking-success{text-align:center;padding:24px 10px;position:relative;z-index:1}
.booking-success h3{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:10px;font-size:1.3rem}
.booking-success h3 .icon{color:#22c55e;width:30px;height:30px}
.booking-success p{color:var(--muted);margin-bottom:18px}
.booking-success .btn{margin:6px}
@media(max-width:820px){.booking-banner{left:0;opacity:.22}.booking-body{max-width:100%}}
@media(max-width:600px){.booking-wrap{padding:24px 18px}.form-grid{grid-template-columns:1fr}}

/* ---------- Sosial ---------- */
.social{background:linear-gradient(#070708,#0b0b0e)}
.social-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.soc-card{display:flex;align-items:center;gap:14px;padding:18px;transition:.3s}
.soc-card:hover{transform:translateY(-4px);border-color:var(--accent)}
.soc-card > .icon:first-child{width:34px;height:34px}
.soc-card .soc-text{flex:1;display:flex;flex-direction:column;min-width:0}
.soc-card b{font-weight:700}
.soc-card .soc-text span{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.soc-card > .icon:last-child{width:18px;height:18px;color:var(--accent)}
.soc-card.instagram{background:linear-gradient(135deg,rgba(131,58,180,.45),rgba(253,29,29,.35),rgba(252,176,69,.25))}
.soc-card.whatsapp{background:linear-gradient(135deg,rgba(22,163,74,.5),rgba(22,163,74,.2))}
@media(max-width:900px){.social-grid{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.social-grid{grid-template-columns:1fr}}

/* ---------- Footer ---------- */
.footer{border-top:1px solid var(--line);background:#050506;padding:34px 0 26px}
.foot-grid{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px}
.foot-nav{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;color:var(--muted);font-size:.9rem}
.foot-nav a:hover{color:var(--accent)}
.foot-nav span{color:#444}
.foot-social{display:flex;gap:12px}
.foot-social a{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);transition:.3s}
.foot-social a:hover{background:var(--accent);border-color:var(--accent)}
.foot-social .icon{width:18px;height:18px}
.foot-contact,.copy{width:100%;text-align:center;color:var(--muted);font-size:.88rem}
.foot-contact{margin-top:6px}
.copy{font-size:.8rem;opacity:.8}
@media(max-width:800px){.foot-grid{justify-content:center;text-align:center}}

/* ---------- Maintenance & Toast ---------- */
.maintenance{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.94);display:grid;place-items:center;padding:20px}
.maint-card{padding:40px 30px;text-align:center;max-width:460px}
.maint-card h1{color:var(--accent);font-family:Orbitron,sans-serif;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,160%);padding:14px 22px;border-radius:14px;background:#161618;border:1px solid var(--line);z-index:200;transition:.4s;max-width:90%;text-align:center;font-weight:600;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.toast.show{transform:translate(-50%,0)}
.toast.ok{border-color:#22c55e}
.toast.err{border-color:var(--accent)}
</style>
</head>
<body>

<div id="maintenance" class="maintenance" hidden>
  <div class="glass maint-card">
    <h1>3 GARAGE</h1>
    <p id="maintMsg"></p>
  </div>
</div>

<header class="site-header" id="header">
  <a href="#beranda" class="brand" id="brand" aria-label="3 GARAGE"></a>
  <nav class="main-nav" id="mainNav" aria-label="Menu utama"></nav>
  <button class="burger" id="burger" aria-label="Buka menu" aria-expanded="false"><span></span><span></span><span></span></button>
  <div class="dropdown glass" id="dropdown">
    <div id="dropdownLinks"></div>
    <a href="admin.html" class="dd-link" id="ddAdmin"></a>
  </div>
</header>

<!-- HERO -->
<section id="beranda" class="hero" data-section="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-overlay"></div>
  <div class="container hero-content">
    <h1 class="hero-title" id="heroTitle"></h1>
    <h2 class="hero-sub" id="heroSubtitle"></h2>
    <p class="hero-tag" id="heroTagline"></p>
    <p class="hero-slogan" id="heroSlogan"></p>
    <div class="hero-btns">
      <a href="#booking" class="btn btn-primary" id="heroBtnBooking"></a>
      <a href="#produk" class="btn btn-ghost" id="heroBtnCatalog"></a>
    </div>
  </div>
</section>

<!-- TENTANG KAMI -->
<section id="tentang" class="about" data-section="about">
  <div class="container">
    <div class="about-grid">
      <div class="glass video-card" id="videoCard"></div>
      <div class="about-text">
        <h2><span id="aboutTitle"></span> <span class="red" id="aboutHighlight"></span></h2>
        <p class="about-desc" id="aboutDesc"></p>
        <ul class="checks" id="aboutPoints"></ul>
        <a href="#tentang" class="btn btn-outline" id="aboutBtn"></a>
      </div>
    </div>
    <div class="features" id="aboutFeatures"></div>
  </div>
</section>

<!-- PRODUK -->
<section id="produk" class="products" data-section="products">
  <div class="container">
    <div class="sec-head">
      <h2 class="sec-title"><span class="bar"></span><span id="productsTitle"></span></h2>
      <button class="link-btn" id="toggleAll" hidden>Lihat Semua →</button>
    </div>
    <div class="product-grid" id="productGrid">
      <div class="empty glass">Memuat produk...</div>
    </div>
  </div>
</section>

<!-- BOOKING -->
<section id="booking" class="booking" data-section="booking">
  <div class="container">
    <div class="glass booking-wrap">
      <div class="booking-banner" id="bannerBg"></div>
      <div class="booking-body" id="bookingBody">
        <h2 class="sec-title" id="bannerTitle"></h2>
        <p id="bannerDesc"></p>
        <form id="bookingForm" novalidate>
          <div class="form-grid">
            <label>Nama Pelanggan
              <input name="name" maxlength="80" autocomplete="name" placeholder="Nama lengkap" required>
            </label>
            <label>Nomor WhatsApp
              <input name="phone" inputmode="tel" maxlength="20" autocomplete="tel" placeholder="08xxxxxxxxxx" required>
            </label>
            <label>Tipe Kendaraan
              <input name="vehicleType" maxlength="60" placeholder="Contoh: Subaru WRX STI / Mazda CX-5" required>
            </label>
            <label>Jenis Servis
              <select name="serviceType" id="serviceType" required></select>
            </label>
            <label>Tanggal Booking
              <input type="date" name="date" id="bookDate" required>
            </label>
            <label class="full">Keluhan Kendaraan
              <textarea name="complaint" rows="3" maxlength="500" placeholder="Ceritakan keluhan kendaraan (opsional)"></textarea>
            </label>
          </div>
          <p class="field-error" id="formError"></p>
          <button class="btn btn-primary" type="submit" id="bookingSubmit">
            <span>Booking Sekarang</span>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </form>
        <div class="booking-success" id="bookingSuccess" hidden></div>
      </div>
    </div>
  </div>
</section>

<!-- SOSIAL MEDIA -->
<section id="sosial" class="social" data-section="social">
  <div class="container">
    <div class="social-grid" id="socialGrid"></div>
  </div>
</section>

<!-- FOOTER -->
<footer class="footer">
  <div class="container foot-grid">
    <a href="#beranda" class="brand" id="footBrand" aria-label="3 GARAGE"></a>
    <nav class="foot-nav" id="footNav" aria-label="Navigasi footer"></nav>
    <div class="foot-social" id="footSocial"></div>
    <div class="foot-contact" id="footContact"></div>
    <div class="copy" id="copyright"></div>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, increment,
  collection, addDoc, query, where, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  firebaseConfig, DEFAULT_SITE, SERVICE_TYPES, icon, esc, safeCssUrl, rupiah,
  waLink, ytId, normalizePhone, isValidPhone, todayStr, mergeSite
} from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const $ = (s) => document.querySelector(s);
let config = mergeSite({});
let products = [];
let showAllProducts = false;
let isAdminViewer = false;

// ---------- UI helper ----------
function toast(msg, type = "ok") {
  const t = $("#toast");
  t.textContent = msg;
  t.className = `toast show ${type}`;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 3800);
}

function friendlyError(err) {
  const map = {
    "permission-denied": "Akses ditolak oleh server. Silakan coba lagi nanti.",
    "unavailable": "Tidak dapat terhubung ke server. Periksa koneksi internet Anda.",
    "resource-exhausted": "Terlalu banyak permintaan. Coba beberapa saat lagi."
  };
  return map[err?.code] || "Terjadi kesalahan. Silakan coba lagi.";
}

// ---------- Terapkan konfigurasi ke halaman ----------
function applyConfig(c) {
  config = c;
  document.title = `${c.heroTitle} | ${c.heroSubtitle}`;
  if (c.faviconUrl) $("#favicon").href = c.faviconUrl;
  document.documentElement.style.setProperty("--accent", c.accentColor || DEFAULT_SITE.accentColor);
  document.body.style.backgroundImage = c.bgUrl
    ? `linear-gradient(rgba(7,8,10,.92),rgba(7,8,10,.97)),url("${safeCssUrl(c.bgUrl)}")`
    : "";
  document.body.style.backgroundSize = "cover";
  document.body.style.backgroundAttachment = "fixed";

  // Logo
  const logoHtml = c.logoUrl
    ? `<img src="${esc(c.logoUrl)}" alt="3 GARAGE">`
    : `<span class="logo-text"><b>3</b> GARAGE<small>SUBARU • MAZDA SPECIALIST</small></span>`;
  $("#brand").innerHTML = logoHtml;
  $("#footBrand").innerHTML = logoHtml;

  // Hero
  $("#heroBg").style.backgroundImage = c.heroBgUrl ? `url("${safeCssUrl(c.heroBgUrl)}")` : "";
  $("#heroBg").style.background = c.heroBgUrl ? "" : "radial-gradient(circle at 70% 40%,#2a0a0a,#050506 60%)";
  $("#heroBg").style.backgroundSize = "cover";
  $("#heroTitle").textContent = c.heroTitle;
  $("#heroSubtitle").textContent = c.heroSubtitle;
  $("#heroTagline").textContent = c.heroTagline;
  $("#heroSlogan").textContent = c.heroSlogan;
  $("#heroBtnBooking").innerHTML = `${icon("calendar")}<span>${esc(c.heroBtnBooking)}</span>${icon("arrowRight")}`;
  $("#heroBtnCatalog").innerHTML = `${icon("box")}<span>${esc(c.heroBtnCatalog)}</span>${icon("arrowRight")}`;

  // Navigasi
  const navItems = (c.nav || []).filter((n) => n.show);
  const navIcon = (t) => ({ "#beranda": "home", "#booking": "wrench", "#produk": "box", "#sosial": "share" }[t] || "check");
  $("#mainNav").innerHTML = navItems
    .map((n) => `<a href="${esc(n.target)}" class="nav-link" data-target="${esc(n.target)}">${icon(navIcon(n.target))}<span>${esc(n.label)}</span></a>`)
    .join("");
  $("#dropdownLinks").innerHTML = navItems
    .filter((n) => n.target !== "#beranda")
    .map((n) => `<a href="${esc(n.target)}" class="dd-link" data-close="1">${icon(navIcon(n.target))}<span>${esc(n.label)}</span></a>`)
    .join("");
  $("#ddAdmin").innerHTML = `${icon("user")}<span>${isAdminViewer ? "Buka Dashboard Admin" : "Login Admin"}</span>`;
  $("#footNav").innerHTML = navItems
    .map((n) => `<a href="${esc(n.target)}">${esc(n.label)}</a>`)
    .join("<span>|</span>");

  // Tampilkan / sembunyikan section
  for (const [key, on] of Object.entries(c.sections)) {
    document.querySelectorAll(`[data-section="${key}"]`).forEach((el) => (el.hidden = !on));
  }

  // Tentang kami
  const yt = ytId(c.youtubeUrl);
  $("#videoCard").innerHTML = yt
    ? `<iframe src="https://www.youtube.com/embed/${yt}" title="Video 3 GARAGE" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`
    : c.aboutImageUrl
      ? `<img src="${esc(c.aboutImageUrl)}" alt="Tentang 3 GARAGE">`
      : `<div class="video-empty">${icon("play")}<p>Video belum diatur admin</p></div>`;
  $("#aboutTitle").textContent = c.aboutTitle;
  $("#aboutHighlight").textContent = c.aboutHighlight;
  $("#aboutDesc").textContent = c.aboutDesc;
  $("#aboutPoints").innerHTML = (c.aboutPoints || []).map((p) => `<li>${icon("check")}<span>${esc(p)}</span></li>`).join("");
  $("#aboutBtn").textContent = c.aboutBtn;
  $("#aboutFeatures").innerHTML = (c.aboutFeatures || [])
    .map((f) => `<div class="glass feature">${icon(f.icon)}<h3>${esc(f.title)}</h3></div>`)
    .join("");

  // Produk & banner
  $("#productsTitle").textContent = c.productsTitle;
  $("#bannerBg").style.backgroundImage = c.bannerUrl ? `url("${safeCssUrl(c.bannerUrl)}")` : "";
  $("#bannerTitle").innerHTML = `${icon("calendar")}<span>${esc(c.bannerTitle)}</span>`;
  $("#bannerDesc").textContent = c.bannerDesc;

  // Sosial media
  const socDefs = [
    ["instagram", "Instagram"],
    ["tiktok", "TikTok"],
    ["youtube", "YouTube"],
    ["whatsapp", "WhatsApp"]
  ];
  const visibleSocial = socDefs.filter(([k]) => c.socials[k]?.show && c.socials[k]?.url);
  $("#socialGrid").innerHTML = visibleSocial.length
    ? visibleSocial
        .map(([k, name]) => `
          <a class="glass soc-card ${k}" href="${esc(c.socials[k].url)}" target="_blank" rel="noopener noreferrer">
            ${icon(k)}
            <div class="soc-text"><b>${name}</b><span>${esc(c.socials[k].label || "")}</span></div>
            ${icon("arrowRight")}
          </a>`)
        .join("")
    : `<p class="muted" style="grid-column:1/-1;text-align:center">Belum ada akun sosial media.</p>`;
  $("#footSocial").innerHTML = visibleSocial
    .map(([k, name]) => `<a href="${esc(c.socials[k].url)}" target="_blank" rel="noopener noreferrer" aria-label="${name}">${icon(k)}</a>`)
    .join("");

  // Footer
  $("#footContact").innerHTML = [c.footerContact, c.footerAddress].filter(Boolean).map(esc).join(" • ");
  $("#copyright").textContent = c.copyright;

  // Mode perawatan
  const showMaint = c.maintenance && !isAdminViewer;
  $("#maintenance").hidden = !showMaint;
  $("#maintMsg").textContent = c.maintenanceMsg;
  document.body.style.overflow = showMaint ? "hidden" : "";

  renderProducts();
}

// ---------- Produk (realtime) ----------
function renderProducts() {
  const grid = $("#productGrid");
  const btn = $("#toggleAll");
  const list = products.slice().sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  if (!list.length) {
    grid.innerHTML = `<div class="empty glass">Belum ada produk yang ditampilkan.</div>`;
    btn.hidden = true;
    return;
  }
  const shown = showAllProducts ? list : list.slice(0, 4);
  btn.hidden = list.length <= 4;
  btn.innerHTML = showAllProducts ? `Tutup ↑` : `Lihat Semua ${icon("arrowRight")}`;

  grid.innerHTML = shown
    .map((p) => {
      const out = Number(p.stock) <= 0;
      const msg = `Halo 3 GARAGE, saya ingin memesan sparepart: ${p.name} (${rupiah(p.price)}). Apakah stok masih tersedia?`;
      const link = config.whatsappNumber ? waLink(config.whatsappNumber, msg) : "";
      const action = out
        ? `<button class="btn btn-ghost btn-block" disabled>Stok Habis</button>`
        : link
          ? `<a class="btn btn-wa btn-block" href="${link}" target="_blank" rel="noopener noreferrer">${icon("whatsapp")}<span>Pesan via WA</span></a>`
          : `<button class="btn btn-ghost btn-block" disabled>WhatsApp belum diatur</button>`;
      return `
        <article class="glass product">
          <div class="p-img">${p.imageUrl ? `<img loading="lazy" src="${esc(p.imageUrl)}" alt="${esc(p.name)}">` : icon("box")}</div>
          <h3>${esc(p.name)}</h3>
          <div class="p-row">
            <span class="price">${rupiah(p.price)}</span>
            <span class="stock ${out ? "out" : ""}">Stok: ${Number(p.stock) || 0}</span>
          </div>
          ${p.description ? `<p class="p-desc">${esc(p.description)}</p>` : ""}
          ${action}
        </article>`;
    })
    .join("");
}

$("#toggleAll").addEventListener("click", () => {
  showAllProducts = !showAllProducts;
  renderProducts();
});

// ---------- Booking ----------
const serviceSelect = $("#serviceType");
serviceSelect.innerHTML =
  `<option value="">Pilih jenis servis</option>` +
  SERVICE_TYPES.map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
$("#bookDate").min = todayStr();

function validateBooking(b) {
  if (b.name.length < 2 || b.name.length > 80) return "Nama wajib diisi (2–80 karakter).";
  if (!isValidPhone(b.phone)) return "Nomor WhatsApp tidak valid. Contoh: 08xxxxxxxxxx";
  if (b.vehicleType.length < 2 || b.vehicleType.length > 60) return "Tipe kendaraan wajib diisi (maks. 60 karakter).";
  if (!SERVICE_TYPES.includes(b.serviceType)) return "Silakan pilih jenis servis.";
  if (!/^\d{4}-\d{2}-\d{2}$/.test(b.date) || b.date < todayStr()) return "Tanggal booking tidak valid (tidak boleh di masa lalu).";
  if (b.complaint.length > 500) return "Keluhan maksimal 500 karakter.";
  return "";
}

function showBookingSuccess(b) {
  const text =
    `Halo 3 GARAGE, saya sudah mengirim booking servis.\n` +
    `Nama: ${b.name}\nKendaraan: ${b.vehicleType}\nServis: ${b.serviceType}\n` +
    `Tanggal: ${b.date}\nKeluhan: ${b.complaint || "-"}`;
  const link = config.whatsappNumber ? waLink(config.whatsappNumber, text) : "";
  const box = $("#bookingSuccess");
  box.innerHTML = `
    <h3>${icon("check")}<span>Booking berhasil dikirim</span></h3>
    <p>Tim kami akan menghubungi Anda untuk konfirmasi jadwal.</p>
    ${link ? `<a class="btn btn-wa" href="${link}" target="_blank" rel="noopener noreferrer">${icon("whatsapp")}<span>Konfirmasi via WhatsApp</span></a>` : ""}
    <button class="btn btn-ghost" id="bookAgain" type="button">Booking Lagi</button>`;
  box.hidden = false;
  $("#bookingForm").hidden = true;
  $("#bookAgain").addEventListener("click", () => {
    box.hidden = true;
    $("#bookingForm").hidden = false;
  });
}

$("#bookingForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const data = {
    name: form.name.value.trim(),
    phone: normalizePhone(form.phone.value),
    vehicleType: form.vehicleType.value.trim(),
    serviceType: form.serviceType.value,
    date: form.date.value,
    complaint: form.complaint.value.trim()
  };
  const error = validateBooking(data);
  $("#formError").textContent = error;
  if (error) return;

  const btn = $("#bookingSubmit");
  const label = btn.querySelector("span");
  btn.disabled = true;
  label.textContent = "Mengirim...";
  try {
    await addDoc(collection(db, "bookings"), {
      ...data,
      status: "Menunggu",
      createdAt: serverTimestamp()
    });
    showBookingSuccess(data);
    form.reset();
    $("#bookDate").min = todayStr();
    toast("Booking berhasil dikirim!");
  } catch (err) {
    console.error("Booking gagal:", err);
    toast(friendlyError(err), "err");
  } finally {
    btn.disabled = false;
    label.textContent = "Booking Sekarang";
  }
});

// ---------- Header: burger, dropdown, scroll ----------
const burger = $("#burger");
const dropdown = $("#dropdown");
function setMenu(open) {
  burger.classList.toggle("open", open);
  dropdown.classList.toggle("open", open);
  burger.setAttribute("aria-expanded", String(open));
}
burger.addEventListener("click", (e) => {
  e.stopPropagation();
  setMenu(!dropdown.classList.contains("open"));
});
document.addEventListener("click", (e) => {
  if (!dropdown.contains(e.target) && e.target !== burger) setMenu(false);
  if (e.target.closest("[data-close]")) setMenu(false);
});
window.addEventListener("scroll", () => {
  $("#header").classList.toggle("scrolled", window.scrollY > 40);
}, { passive: true });

// Navigasi aktif (merah) mengikuti section yang terlihat
const spy = new IntersectionObserver((entries) => {
  entries.forEach((en) => {
    if (!en.isIntersecting) return;
    const id = "#" + en.target.id;
    document.querySelectorAll(".nav-link").forEach((a) => a.classList.toggle("active", a.dataset.target === id));
  });
}, { rootMargin: "-45% 0px -50% 0px" });
document.querySelectorAll("section[id]").forEach((s) => spy.observe(s));

// Animasi muncul saat di-scroll
const revealObs = new IntersectionObserver((entries) => {
  entries.forEach((en) => {
    if (en.isIntersecting) {
      en.target.classList.add("in");
      revealObs.unobserve(en.target);
    }
  });
}, { threshold: 0.12 });
document.querySelectorAll("section .container").forEach((el) => {
  el.classList.add("reveal");
  revealObs.observe(el);
});

// ---------- Kunjungan (dihitung sekali per sesi browser) ----------
async function countVisit() {
  if (sessionStorage.getItem("visited")) return;
  sessionStorage.setItem("visited", "1");
  const ref = doc(db, "stats", "visits");
  try {
    await updateDoc(ref, { count: increment(1) });
  } catch {
    try {
      await setDoc(ref, { count: 1 });
    } catch (err) {
      console.warn("Penghitung kunjungan dilewati:", err.code);
    }
  }
}

// ---------- Inisialisasi ----------
onAuthStateChanged(auth, async (user) => {
  isAdminViewer = false;
  if (user) {
    try {
      isAdminViewer = (await getDoc(doc(db, "admins", user.uid))).exists();
    } catch {
      isAdminViewer = false;
    }
  }
  applyConfig(config);
});

onSnapshot(
  doc(db, "site", "config"),
  (snap) => applyConfig(mergeSite(snap.exists() ? snap.data() : {})),
  (err) => {
    console.error("Gagal memuat konfigurasi:", err);
    applyConfig(mergeSite({}));
    toast("Gagal memuat konfigurasi website.", "err");
  }
);

onSnapshot(
  query(collection(db, "products"), where("active", "==", true)),
  (snap) => {
    products = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    renderProducts();
  },
  (err) => {
    console.error("Gagal memuat produk:", err);
    $("#productGrid").innerHTML = `<div class="empty glass">Gagal memuat produk. Muat ulang halaman.</div>`;
  }
);

countVisit();
</script>
